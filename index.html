<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="הולו, אתרים ודפי נחיתה פרימיום לבעלות עסקים — נוכחות דיגיטלית שחוסכת זמן בשירות וממירה מתעניינות ללקוחות משלמות"
    />
    <meta name="theme-color" content="#942839" />
    <meta property="og:title" content="הולו אלמו | עיצוב ובניית אתרים" />
    <meta
      property="og:description"
      content="הולו, אתרים ודפי נחיתה פרימיום לבעלות עסקים — נוכחות דיגיטלית שחוסכת זמן בשירות וממירה מתעניינות ללקוחות משלמות"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="he_IL" />
    <style>
      #app-boot {
        min-height: 100svh;
        background: #ffffff;
        color: #121212;
      }

      .app-boot-shell {
        box-sizing: border-box;
        max-width: 72rem;
        margin: 0 auto;
        padding: 5.75rem 1.5rem 2rem;
      }

      .app-boot-bar {
        height: 3.25rem;
        border-radius: 999px;
        background: linear-gradient(90deg, rgb(148 40 57 / 0.08), rgb(148 40 57 / 0.03));
        margin-bottom: 2.5rem;
      }

      .app-boot-headline {
        height: 1.35rem;
        max-width: 18rem;
        border-radius: 999px;
        background: rgb(17 17 17 / 0.08);
        margin: 0 auto 0.85rem;
      }

      .app-boot-headline--accent {
        max-width: 14rem;
        background: rgb(148 40 57 / 0.14);
      }

      .app-boot-visual {
        height: clamp(14rem, 42vw, 22rem);
        margin-top: 2rem;
        border-radius: 1.25rem;
        background: linear-gradient(180deg, rgb(148 40 57 / 0.05), rgb(148 40 57 / 0.02));
      }

      @media (min-width: 768px) {
        .app-boot-shell {
          padding-top: 7rem;
          text-align: center;
        }

        .app-boot-headline {
          height: 1.6rem;
          max-width: 24rem;
        }

        .app-boot-headline--accent {
          max-width: 20rem;
        }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Rubik:wght@700;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Rubik:wght@700;800&display=swap"
      />
    </noscript>
    <link rel="preload" as="image" href="/images/portfolio/cohen-law-hero.png" fetchpriority="high" />
    <title>הולו אלמו | עיצוב ובניית אתרים</title>
    <script>
      if (localStorage.getItem('hulu-theme') === 'dark') {
        document.documentElement.classList.add('dark')
      } else {
        document.documentElement.classList.remove('dark')
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div id="app-boot" aria-hidden="true">
        <div class="app-boot-shell">
          <div class="app-boot-bar"></div>
          <div class="app-boot-headline"></div>
          <div class="app-boot-headline app-boot-headline--accent"></div>
          <div class="app-boot-visual"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
